<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/logoOST.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">

        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

</head>

<body onload="validarSessao(), listarTop(), listarMedia(), listarGrafico(), buscarScore(), buscarTopOst(), listarGraphTentativas()">

    <div class="janela">
        <div class="header-left">
            <h1>Original Soundtrack</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!
                    <br>
                    Seu id é: <span id="b_id">id</span>
                </h3>
            </div>

            <div class="btn-nav-white">
                <a href="./cards.html">
                    <h3>Quiz</h3>
                </a>
            </div>

            <div class="btn-nav">

                <h3>Ranking</h3>

            </div>

            <div class="btn-nav-white">
                <a href="./mural.html">
                    <h3>Fórum</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash">
            <div id="alerta">
            </div>
            <div class="area-parametros-alerta">
                <div class="parametros-alerta">
                    <div class="item-regua perigo-frio">
                        <p>Usuário com mais acertos</p>
                        <p><span id="r_usuario">usuario</span>#<span id="idUser">id</span></p>
                    </div>
                    <div class="item-regua alerta-frio">
                        <p>OST com mais acertos</p>
                        <p id="ost">ost#1</p>
                    </div>
                    <div class="item-regua alerta-quente">
                        <p>Números de Jogadores</p>
                        <p id="qtd_user">qtd_user</p>
                    </div>
                    <div class="item-regua perigo-quente">
                        <p>Seu<br>score:</p>
                        <p><span id="scoreUser">0</span>/10</p>
                    </div>
                    <div class="item-regua ideal">
                        <p>Média de acertos</p>
                        <p> <span id="media">media</span>/10</p>
                    </div>
            
                </div>
            </div>

            <div class="graphs-line">
                <div class="ranking-graph" id="div_posicao">
                    <div class="posicao" id="titulos">
                        <span>Posição</span>
                        <span>Nomes</span>
                        <span>Acertos</span>
                    </div>
                    <br>
                </div>
                <div class="ranking-avg-graph">
                    <canvas id="grafico-media"></canvas>
                </div>
            </div>

            <div class="graphs-line">
                <div class="ranking-graph">
                    <canvas id="graph-attempt"></canvas>
                </div>
                <div class="ranking-attempt-graph">
                    <span>Tentativas:</span>
                    <span id="datas"></span>
                </div>
            </div>
        </div>
    </div>


</body>

</html>
<!-- Desejável: mostrar tentativas -->
<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    b_id.innerHTML = sessionStorage.ID_USUARIO
    let idUser = sessionStorage.ID_USUARIO;
    const ranking = document.getElementById('grafico-media');
    Chart.defaults.color = '#FFF';
    Chart.defaults.font.size = 16;

    function listarTop() {
        fetch("/ranking/buscar").then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (resposta) {
                    console.log("Dados recebidos: ", JSON.stringify(resposta));
                    var topUser = resposta[0];
                    document.getElementById("r_usuario").innerHTML = topUser.nome;
                    document.getElementById("idUser").innerHTML = topUser.fkUsuario;

                })
            }
        })
    }
    function listarMedia() {
        fetch("/ranking/calcular").then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (resposta) {
                    console.log("Dados recebidos: ", JSON.stringify(resposta));
                    var resultMedia = resposta[0];
                    document.getElementById("media").innerHTML = resultMedia.media;
                    plotarGrafico(resposta);
                })
            }
        })
    }

    function buscarScore() {
        fetch(`/ranking/score/${idUser}`, {
            method: "GET"
        }).then(res => {
            res.json().then(json => {
                const usuario = json[0];
                document.getElementById("scoreUser").innerHTML = usuario.qtd_acertos;
            })
        })
        .catch(err => {
            console.log(err);
        })
    }

    function buscarTopOst() {
        fetch("/ranking/buscar/topOst").then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (resposta) {
                    console.log("Dados recebidos: ", JSON.stringify(resposta));
                    var topOst = resposta[0];
                    document.getElementById("ost").innerHTML = topOst.titulo;
                })
            }
        })
    }

   
    function listarGrafico() {

        fetch("/ranking/listar", { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    let posicao = 1;
                    for (let i = 0; i < resposta.length; i++) {
                        document.getElementById("div_posicao").innerHTML += `
                        <div class="posicao" ${resposta[i].fkUsuario == idUser ? 'id="meuUser"' : ''}>
                            <span>${posicao}º</span>
                            <span>${resposta[i].nome}#${resposta[i].fkUsuario}</span>
                            <span>${resposta[i].qtd_acertos}</span>
                        </div><br>`
                        posicao ++;
                        if (resposta[i].fkUsuario == idUser) {
                            sessionStorage.setItem("acertosUser", resposta[i].qtd_acertos);
                            document.getElementById("meuUser").style.backgroundColor = "#E63946";
                        }
                    }
                    document.getElementById("qtd_user").innerHTML = resposta.length;
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function listarGraphTentativas() {
        fetch(`/ranking/tentativa/graph/${idUser}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    
        
                    plotarGraficoTentativa(resposta);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
    // Configura o gráfico (cores, tipo, etc), materializa-o na página
    function plotarGrafico(resposta) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Acertos',
                data: [],
                fill: false,
                borderWidth: 1,
                borderColor: '#E63946',
                backgroundColor: '#E63946'
            }]
        };
        let options = {
            responsive: true,
            maintainAspectRatio: false
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
            var registro = resposta[0];
            labels.push(sessionStorage.NOME_USUARIO);
            dados.datasets[0].data.push(sessionStorage.acertosUser);
            labels.push('Média');
            dados.datasets[0].data.push(resposta[0].media);

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'bar',
            data: dados,
            options: options
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById('grafico-media'),
            config
        );
    }

    function plotarGraficoTentativa(resposta) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Acertos',
                data: [],
                fill: false,
                borderWidth: 1,
                borderColor: '#E63946',
                backgroundColor: '#E63946'
            }]
        };
        let options = {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    offset: true
                },
                y: {
                    offset: true,
                    ticks: {
                        stepSize: 1,
                        precision: 0
                    },
                    beginAtZero: false,
                    grid: {
                        display: true,
                        color: '#d2b48c',
                        lineWidth: 0.3
                    }
                }
            }
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
            
            for (let i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                labels.push(`Tentativa ${i + 1}`);
                dados.datasets[0].data.push(registro.qtd_acertos);

                datas.innerHTML += `
                Tentativa ${i + 1}: <span class="data">${registro.dtTentativa}</span><br>`
                
            }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'line',
            data: dados,
            options: options
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById('graph-attempt'),
            config
        );
    }

    // Esta função *atualizarGrafico* atualiza o gráfico que foi renderizado na página,
    // buscando a última medida inserida em tabela contendo as capturas,

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
</script>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/logoOST.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OST | Quiz</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao(), esconderQuiz(), salvarAcertos()">

    <div class="janela">

        <div class="header-left dash-header">

            <h1>Original Soundtrack</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!
                    <br>
                    Seu id é: <span id="b_id">id</span>
                </h3>
            </div>

            <div class="btn-nav">
                <a href="./cards.html">
                    <h3>Quiz</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="javascript:void(0)" onclick="verificarQuiz()">
                    <h3>Ranking</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./mural.html">
                    <h3>Fórum</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="inicio" id="iniciarBotao">
            <span>INICIAR QUIZ</span>
            <button onclick="iniciarQuiz()" class="botao">Iniciar</button>

        </div>

        <div id="div_aguardar" class="loading-div">
            <img src="../assets/imgs/simon-gurren-laggan.gif" id="loading-gif">
            <br>
            <p id="p_aguardar">Redirecionando...</p>
        </div>

        <div class="body" id="main">
            <!-- As questões são geradas a partir das OSTs do Last.fm -->
            <div id="div_questoes" style="display: contents"></div>

            <div class="btn-final" id="div_botao">
                <button class="btn-nav" onclick="finalizarQuiz()" style="cursor: pointer;">Finalizar Quiz</button>
            </div>
        </div>
        

    </div>

    </div>

    </div>

</body>

<script>
    b_id.innerHTML = sessionStorage.ID_USUARIO;
    let idUser = sessionStorage.ID_USUARIO;
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    const DURACAO_TRECHO = 10;

    // Quiz gerado pelo servidor (as respostas corretas ficam apenas no servidor)
    let quiz = null;
    let timerTrecho = null;
    let timerContagem = null;

    // Tempo (em segundos) gasto em cada questão, do momento em que ela aparece até a resposta
    let temposVetor = [];
    let inicioQuestao = null;

    function registrarTempo(questao) {
        temposVetor[questao - 1] = (Date.now() - inicioQuestao) / 1000;
    }

    function finalizarQuiz() {
        pararTrecho();

        let respostasVetor = [];
        for (let i = 0; i < quiz.questoes.length; i++) {
            let radio = document.querySelector(`input[name="Q${i + 1}"]:checked`);
            if (!radio) {
                window.alert(`Responda a questão ${i + 1} antes de finalizar o quiz`);
                return;
            }
            respostasVetor.push(Number(radio.value));
        }
        registrarTempo(quiz.questoes.length);

        p_aguardar.innerHTML = "Redirecionando...";
        aguardar();

        fetch("/quiz/responder", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                quizServer: quiz.id,
                respostasServer: respostasVetor,
                temposServer: temposVetor,
                userServer: sessionStorage.ID_USUARIO
            }),
        })
        .then(function (resposta){
            console.log("resposta: ", resposta);

            if (resposta.ok) {
                setTimeout(function () {
                    window.location = "./dashboard.html";
                }, 1000);
            } else {
                console.log("Houve um erro ao registrar a resposta do usuário");
                window.location = "cards.html";
            }
        });
    }

    function esconderQuiz() {
        setTimeout(() => {
            if (sessionStorage.acertosUser >= 0) {
                iniciarBotao.innerHTML += `<br>
                <a class="verifResul" href="./dashboard.html">Verificar meu resultado</a>`
            }
        }, 1000);

        document.getElementById('div_botao').style.display = "none";
        document.getElementById('main').style.display = "none";
    }

    function iniciarQuiz() {
        p_aguardar.innerHTML = "Buscando as OSTs...";
        aguardar();

        fetch("/quiz/gerar", { cache: 'no-store' })
            .then(function (resposta) {
                return resposta.json().then(function (json) {
                    if (!resposta.ok) throw new Error(json);
                    return json;
                });
            })
            .then(function (json) {
                quiz = json;
                temposVetor = [];
                montarQuestoes();

                div_aguardar.style.display = "none";
                document.getElementById('main').style.display = "flex";
                document.getElementById('iniciarBotao').style.display = "none";
                mostrarQuestao(1);
            })
            .catch(function (erro) {
                div_aguardar.style.display = "none";
                console.error(erro);
                window.alert(`Não foi possível montar o quiz: ${erro.message}`);
            });
    }

    function escaparHtml(texto) {
        return String(texto).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    function montarQuestoes() {
        let total = quiz.questoes.length;
        let html = "";

        quiz.questoes.forEach(function (questao, i) {
            let numero = i + 1;
            let alternativas = questao.alternativas.map(function (alternativa, j) {
                let idRadio = `Q${numero}_${j}`;
                return `
                        <div class="choices">
                            <input type="radio" id="${idRadio}" name="Q${numero}" value="${j}">
                            <label for="${idRadio}">
                                <img src="${escaparHtml(alternativa.imagem)}" alt="${escaparHtml(alternativa.midia)}" title="${escaparHtml(alternativa.midia)}"
                                    onerror="this.onerror=null; this.src='../assets/icon/logoOST.png'">
                            </label>
                        </div>`;
            });

            html += `
            <div class="question" id="Q${numero}" style="display: none">
                <span>Questão ${numero} - De onde é essa OST?</span>
                <audio src="${escaparHtml(escolherPreview(questao))}" id="A${numero}" preload="auto"
                    data-alternativo="${escaparHtml(questao.previewAlternativo || "")}"></audio>
                <button class="btn-nav questao" onclick="tocarTrecho(${numero})">
                    <span id="contagem${numero}">Ouvir trecho novamente</span>
                </button>

                <div class="container-question">
                    <div class="container-choice">${alternativas.slice(0, 2).join("")}
                    </div>
                    <div class="container-choice2">${alternativas.slice(2, 4).join("")}
                    </div>
                </div>
                ${numero < total
                    ? `<button class="btn-nav questao" onclick="mudarQuestao(${numero + 1})">Próxima Questão</button>`
                    : ""}
            </div>`;
        });

        div_questoes.innerHTML = html;
    }

    // As aberturas/encerramentos de anime vêm em .ogg (AnimeThemes); se o navegador não tocar .ogg, usamos o .mp3
    function escolherPreview(questao) {
        let tocaOgg = document.createElement("audio").canPlayType("audio/ogg; codecs=opus") !== "";
        if (/\.ogg($|\?)/.test(questao.preview) && !tocaOgg && questao.previewAlternativo) {
            return questao.previewAlternativo;
        }
        return questao.preview;
    }

    function mostrarQuestao(questao) {
        document.getElementById(`Q${questao}`).style.display = "flex";
        inicioQuestao = Date.now();
        if (questao == quiz.questoes.length) {
            document.getElementById("div_botao").style.display = "flex";
        }
        tocarTrecho(questao);
    }

    // Toca automaticamente um trecho de 10 segundos da música correta
    function tocarTrecho(questao) {
        pararTrecho();

        let musica = document.getElementById(`A${questao}`);
        let contagem = document.getElementById(`contagem${questao}`);
        musica.volume = 0.4;

        // Se o áudio principal falhar, tenta o alternativo
        if (musica.error && musica.dataset.alternativo) {
            musica.src = musica.dataset.alternativo;
            musica.dataset.alternativo = "";
        }

        function iniciar() {
            // O preview tem ~30s, então sorteamos o início do trecho
            let maxInicio = Math.max(0, (musica.duration || 0) - DURACAO_TRECHO);
            musica.currentTime = Math.random() * maxInicio;

            musica.play().then(function () {
                let restante = DURACAO_TRECHO;
                contagem.innerHTML = `Tocando... ${restante}s`;
                timerContagem = setInterval(function () {
                    restante--;
                    contagem.innerHTML = `Tocando... ${restante}s`;
                }, 1000);
                timerTrecho = setTimeout(pararTrecho, DURACAO_TRECHO * 1000);
            }).catch(function (erro) {
                // AbortError: o trecho foi pausado antes de começar (usuário trocou de questão)
                if (erro.name === "AbortError") return;
                // O navegador pode bloquear o autoplay, então o usuário clica para ouvir
                console.log("Autoplay bloqueado: ", erro);
                contagem.innerHTML = "Ouvir trecho";
            });
        }

        if (musica.readyState >= 1) {
            iniciar();
        } else {
            musica.addEventListener("loadedmetadata", iniciar, { once: true });
            musica.addEventListener("error", function () {
                if (musica.dataset.alternativo) tocarTrecho(questao);
            }, { once: true });
            musica.load();
        }
    }

    function pararTrecho() {
        clearTimeout(timerTrecho);
        clearInterval(timerContagem);
        document.querySelectorAll("#div_questoes audio").forEach(function (musica) {
            musica.pause();
        });
        document.querySelectorAll("[id^='contagem']").forEach(function (contagem) {
            contagem.innerHTML = "Ouvir trecho novamente";
        });
    }

    function mudarQuestao(questao) {
        let questaoAtual = document.getElementById(`Q${questao - 1}`);
        let radio = questaoAtual.querySelector('[type="radio"]:checked');
        if (!radio) {
            window.alert("Escolha uma alternativa antes de continuar");
            return;
        }

        registrarTempo(questao - 1);
        pararTrecho();
        questaoAtual.style.display = "none";
        mostrarQuestao(questao);
    }

    function salvarAcertos() {

        fetch("/ranking/listar", { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    for (let i = 0; i < resposta.length; i++) {
                        if (resposta[i].fkUsuario == idUser) {
                            sessionStorage.setItem("acertosUser", resposta[i].qtd_acertos);
                        }
                    }
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function verificarQuiz() {
        if (sessionStorage.acertosUser >= 0) {
            window.location = "./dashboard.html";
        } else {
            window.alert("É necessário realizar o quiz para ter acesso a página de Ranking")
        }
    }
</script>

</html>
